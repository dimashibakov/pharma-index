<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Drug Recalls &amp; Lawsuits — search a drug by its brand and see its lawsuits, recalls, FDA notices and a transparent Litigation & Regulatory Index. Public-records aggregator; not medical or legal advice.">
<meta name="robots" content="noindex">
<title>Drug Recalls &amp; Lawsuits — Zenlo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0;background:#ececf0}
body{color:#111114;font-family:'Funnel Display',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#111114;text-decoration:none} a:hover{color:#3b63b8}
input::placeholder{color:#8a8a93}
.wrapcol{min-height:100vh;display:flex;flex-direction:column}
kbd{font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrapcol">

<div style="position:sticky;top:0;z-index:20;padding:14px 24px;background:linear-gradient(180deg,rgba(236,236,240,.96) 0%,rgba(236,236,240,0) 100%)">
  <header style="max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:10px 10px 10px 28px;background:#fff;border:1px solid rgba(17,17,20,.08);border-radius:999px;box-shadow:0 12px 32px -22px rgba(17,17,20,.3);min-height:66px;flex-wrap:wrap">
    <a href="#home" style="display:flex;align-items:center;gap:14px;flex:none">
      <img src="/assets/zenlo-logo-black.png" alt="Zenlo" style="display:block;height:24px;width:auto">
      <span style="width:1px;height:20px;background:rgba(17,17,20,.15)"></span>
      <span style="font-size:16px;font-weight:500;white-space:nowrap">Drug Recalls &amp; Lawsuits</span>
    </a>
    <nav id="nav" style="display:flex;gap:6px;flex:1;min-width:0;margin-left:8px"></nav>
    <button id="openPal" style="display:flex;align-items:center;gap:10px;font-family:inherit;font-size:14px;color:#33353c;background:#f5f5f6;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;white-space:nowrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>Search <kbd style="font-size:11.5px;border:1px solid rgba(17,17,20,.12);border-radius:6px;padding:0 6px;color:#8a8a93;background:#fff">⌘K</kbd>
    </button>
  </header>
</div>

<main style="flex:1;width:100%;max-width:1288px;margin:0 auto;padding:8px 24px 24px">
  <div style="background:#f5f5f6;border-radius:32px;padding:clamp(24px,4vw,48px)" id="stage">
    <div style="padding:80px 20px;text-align:center;color:#8a8a93;font-size:15px">Loading live data…</div>
  </div>
</main>

<footer style="color:#6b6d75;font-size:12.5px;line-height:1.6;text-align:center;padding:8px 24px 32px">Prototype · public-record aggregator · <b>not medical or legal advice</b> · a lawsuit is an allegation, not proof · figures current to Jul–Nov 2026.</footer>
</div>
<div id="palwrap"></div>

<script>
/* ============ config ============ */
const SB_URL="https://pbzkpsrmsvapyjbdatdr.supabase.co";
const SB_KEY="sb_publishable_WdaqO2t-ee-mva7Yegl9ew_do06lVfA";
const BF="1idRoOY8qWVlN_apojx";

/* ============ tokens / helpers ============ */
const TIER={Low:['#16794a','#e7f5ee','#bfe5cf','#4fb985'],Moderate:['#2f3fbf','#eef0fb','#cfd5f6','#6f84e6'],Elevated:['#8a5a00','#faf1de','#efd59c','#d9a23c'],High:['#b42318','#fdecea','#f6c9c5','#e5534b'],None:['#4a4b55','#f1f0f5','#dedde6','#b9b8c4']};
const GBARS=['#4fb985','#6f84e6','#d9a23c','#e5534b'];
const gArc=(a0,a1)=>{const P=a=>{const t=a*Math.PI/180;return (30+24*Math.cos(t)).toFixed(2)+' '+(32-24*Math.sin(t)).toFixed(2);};return 'M '+P(a0)+' A 24 24 0 0 1 '+P(a1);};
const GSEG=[[174,140],[129,96],[84,51],[40,6]];
const gaugeSegs=b=>{const n=['Low','Moderate','Elevated','High'].indexOf(b)+1;return GSEG.map((s,i)=>({d:gArc(s[0],s[1]),c:i<n?GBARS[i]:'#ecebf1'}));};
const bandOf=v=>v==null?'None':v<25?'Low':v<50?'Moderate':v<75?'Elevated':'High';
const ST={active:'Active',winding:'Winding down',closed:'Closed',mixed:'Mixed',none:'No litigation',excluded:'Excluded'};
const ACC={available:['#16794a','#e7f5ee','#bfe5cf'],limited:['#8a5a00','#faf1de','#efd59c'],paid:['#4a4b55','#f1f0f5','#dedde6'],unavailable:['#b42318','#fdecea','#f6c9c5']};
const SCOPE={brand:['#8a5a00','#faf1de','#efd59c'],ingredient:['#2f3fbf','#eef0fb','#cfd5f6'],molecule:['#2f3fbf','#eef0fb','#cfd5f6'],class:['#16794a','#e7f5ee','#bfe5cf']};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slugify=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const PANEL="border:1px solid rgba(17,17,20,.08);border-radius:16px;padding:24px;background:#fff";
const H3="margin:0 0 11px;font-size:18px;font-weight:500;letter-spacing:-0.01em;color:#111114";
const CHIP="font-size:13px;border:1px solid rgba(17,17,20,.12);background:#fff;border-radius:999px;padding:6px 13px;white-space:nowrap;color:#33353c;cursor:pointer";
const scopeBadge=s=>{const c=SCOPE[s]||SCOPE.molecule;const lbl=s==='molecule'?'molecule':s;return `<span style="font-size:10.5px;font-weight:500;border-radius:6px;padding:2px 7px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;background:${c[1]};border:1px solid ${c[2]};color:${c[0]}">${esc(lbl)}</span>`;};
function noteCard(label,body,tone){const pill=tone==='warn'?'#8a5a00':'#111114';
 return `<div style="background:#fff;border:1px solid rgba(17,17,20,.06);border-radius:20px;padding:16px 20px;display:flex;gap:15px;align-items:flex-start"><span style="background:${pill};color:#fff;font-size:12.5px;font-weight:500;border-radius:999px;padding:6px 15px;flex:none;white-space:nowrap;align-self:flex-start">${esc(label)}</span><div style="font-size:13.5px;color:#33353c;line-height:1.55;flex:1;min-width:0">${body}</div></div>`;}

function gauge(bd,ix,w,h,num){const segs=gaugeSegs(bd).map(s=>`<path d="${s.d}" stroke="${s.c}" stroke-width="${num>40?5:6}" stroke-linecap="round"></path>`).join("");
 return `<span style="position:relative;display:block;width:${w}px;height:${h}px;flex:none"><svg width="${w}" height="${h}" viewBox="0 0 60 36" fill="none" style="position:absolute;inset:0">${segs}</svg><span style="position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:${num}px;font-weight:500;letter-spacing:-0.02em;line-height:1;font-variant-numeric:tabular-nums;color:#111114">${ix==null?'—':ix}</span></span>`;}
function prodCard(p){return `<a href="#product-${p.s}" style="display:block;border:1px solid rgba(17,17,20,.08);border-radius:16px;padding:18px 20px;background:#fff;color:inherit">
  <div style="font-size:16px;font-weight:500;letter-spacing:-0.01em">${esc(p.br)}</div>
  <div style="font-size:11.5px;color:#8a8a93;margin-top:2px">${esc(p.ing.inn)} · ${esc(p.mf||'—')}</div>
  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:14px">${gauge(p.bd,p.ix,72,44,19)}<span style="font-size:12.5px;color:${TIER[p.bd]?TIER[p.bd][0]:'#6b6d75'};width:72px;text-align:center">${p.bd}</span></div></a>`;}

const imgCache={};
function hydrateImages(){
 document.querySelectorAll('[data-wiki]').forEach(el=>{
  if(el.dataset.done)return; el.dataset.done='1';
  const t=el.getAttribute('data-wiki'); if(!t)return;
  const set=u=>{if(u){el.style.backgroundImage='url("'+u+'")';el.style.backgroundSize='contain';el.style.backgroundRepeat='no-repeat';el.style.backgroundPosition='center';el.textContent='';}};
  if(imgCache[t]!==undefined){set(imgCache[t]);return;}
  fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t)).then(r=>r.ok?r.json():null).then(j=>{const u=j&&j.thumbnail&&j.thumbnail.source;imgCache[t]=u||null;set(u);}).catch(()=>{imgCache[t]=null;});
 });
}
function logoHTML(domain,name,size){const s=size||40;
 const mono=(name||'?').replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
 const monoStyle=`width:${s}px;height:${s}px;border-radius:9px;background:#eef0fb;color:#3b63b8;place-items:center;font-size:${Math.round(s*0.36)}px;font-weight:600;flex:none`;
 const monoSpan=`<span style="${monoStyle};display:${domain?'none':'grid'}">${mono}</span>`;
 const img=domain?`<img src="https://cdn.brandfetch.io/domain/${esc(domain)}/w/${s*2}/h/${s*2}?c=${BF}" alt="${esc(name)}" style="width:${s}px;height:${s}px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid rgba(17,17,20,.08);flex:none" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:'';
 return `<span style="display:inline-flex;flex:none">${img}${monoSpan}</span>`;}

/* ============ data load + assembly ============ */
let PRODUCTS=[], ING={}, CLS={}, MAN={}, SOURCES=[], PBYSLUG={}, prodByIng={}, prodByClass={};
async function loadData(){
 const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY};
 const get=t=>fetch(SB_URL+'/rest/v1/'+t,{headers:H}).then(r=>{if(!r.ok)throw new Error(t.split('?')[0]+' '+r.status);return r.json();});
 const [prods,ings,classes,mans,comps,cases,cdefs,scores,srcs]=await Promise.all([
  get('products?select=id,slug,brand_name,ingredient_id,manufacturer_id,indication,form,region,status,signal_index,band,confidence,description&order=signal_index.desc.nullslast'),
  get('ingredients?select=id,slug,inn_name,class_id,description,wiki_title,boxed_warning,fda_summary,ae_value'),
  get('drug_classes?select=id,slug,name,summary'),
  get('manufacturers?select=id,slug,name,description,website,hq,founded'),
  get('product_components?select=product_id,position,name,weight,score,value,scope,is_estimated&order=product_id,position'),
  get('cases?select=id,scope,class_id,ingredient_id,product_id,docket,court,injuries,pending,status,is_excluded,note&order=id'),
  get('case_defendants?select=case_id,manufacturer_id,defendant_name'),
  get('product_scores?select=product_id,version,signal_index,band,created_at&order=product_id,version'),
  get('data_sources?select=name,category,access,notes,coverage')
 ]);
 const by=(arr,k)=>{const o={};arr.forEach(x=>(o[x[k]]=o[x[k]]||[]).push(x));return o;};
 mans.forEach(m=>MAN[m.id]={id:m.id,slug:m.slug,name:m.name,desc:m.description,site:m.website,hq:m.hq,founded:m.founded});
 classes.forEach(c=>CLS[c.id]={id:c.id,slug:c.slug,name:c.name,summary:c.summary,ings:[],prods:[]});
 ings.forEach(g=>{ING[g.id]={id:g.id,slug:g.slug,inn:g.inn_name,class_id:g.class_id,desc:g.description,wiki:g.wiki_title,boxed:g.boxed_warning,fda:g.fda_summary,ae_value:g.ae_value,prods:[]};
   if(CLS[g.class_id])CLS[g.class_id].ings.push(ING[g.id]);});
 const compBy=by(comps,'product_id'), scoreBy=by(scores,'product_id');
 const cdBy=by(cdefs,'case_id');
 cases.forEach(c=>{c._defs=(cdBy[c.id]||[]).map(d=>d.manufacturer_id?(MAN[d.manufacturer_id]||{}).name:d.defendant_name).filter(Boolean);});
 PRODUCTS=prods.map(r=>{
   const g=ING[r.ingredient_id]||{inn:'—',prods:[]};
   const cl=CLS[g.class_id]||null;
   const man=MAN[r.manufacturer_id];
   const cs=(compBy[r.id]||[]).slice().sort((a,b)=>a.position-b.position);
   const myCases=cases.filter(c=>!c.is_excluded && (c.product_id===r.id || c.ingredient_id===r.ingredient_id || (cl&&c.class_id===cl.id)));
   const hist=(scoreBy[r.id]||[]).slice().sort((a,b)=>a.version-b.version);
   const p={id:r.id,s:r.slug,br:r.brand_name,ing:g,cls:cl,mf:man?man.name:null,mfs:man?man.slug:null,ind:r.indication,form:r.form,region:r.region,
     ix:r.signal_index,bd:r.band||bandOf(r.signal_index),conf:r.confidence,desc:r.description,comps:cs,cases:myCases,hist:hist,status:r.status};
   return p;
 });
 PRODUCTS.forEach(p=>{PBYSLUG[p.s]=p;(prodByIng[p.ing.id]=prodByIng[p.ing.id]||[]).push(p);if(p.cls)(prodByClass[p.cls.id]=prodByClass[p.cls.id]||[]).push(p);if(p.ing.prods)p.ing.prods.push(p);if(p.cls)p.cls.prods.push(p);});
 SOURCES=srcs.map(x=>({s:slugify(x.name),nm:x.name,cat:x.category,acc:x.access,note:x.notes||x.coverage||''}));
}
const bySlug=s=>PBYSLUG[s];
const ingBySlug=s=>Object.values(ING).find(g=>g.slug===s);
const clsBySlug=s=>Object.values(CLS).find(c=>c.slug===s);
const manBySlug=s=>Object.values(MAN).find(m=>m.slug===s);
const srcBySlug=s=>SOURCES.find(x=>x.s===s);

/* ============ shared bits ============ */
function caseRows(cases){
 if(!cases.length)return '<p style="font-size:13px;color:#6b6d75;margin:0">No litigation on record.</p>';
 return cases.map(c=>`<div style="display:flex;gap:12px;padding:11px 0;border-top:1px solid rgba(17,17,20,.08);font-size:13.5px">
   <span style="flex:0 0 118px;color:#6b6d75;font-size:12.5px">${esc(c.docket||'—')}<div style="margin-top:5px">${scopeBadge(c.scope)}</div></span>
   <span style="flex:1;min-width:0"><b>${esc(c.injuries||'—')}</b>${c.court&&c.court!=='—'?' · '+esc(c.court):''}${c.status?' · '+esc(ST[c.status]||c.status):''}${c.pending&&c.pending!=='—'?' · pending '+esc(c.pending):''}
   ${c._defs&&c._defs.length?`<div style="color:#6b6d75;font-size:12.5px;margin-top:3px">Defendants: ${esc(c._defs.join(' + '))}</div>`:''}
   ${c.note?`<div style="color:#8a8a93;font-size:12px;margin-top:3px">${esc(c.note)}</div>`:''}</span></div>`).join("");
}

/* ============ pages ============ */
function pHome(){
 const top=PRODUCTS.filter(p=>p.ix!=null).slice(0,6);
 const popular=['ozempic','zantac','tylenol','oxycontin'].map(bySlug).filter(Boolean);
 const classes=Object.values(CLS).filter(c=>c.prods.length).sort((a,b)=>a.name.localeCompare(b.name));
 const legend=[['Low','#4fb985'],['Moderate','#6f84e6'],['Elevated','#d9a23c'],['High','#e5534b']];
 return `<div style="display:flex;flex-direction:column">
  <div style="position:relative;overflow:hidden;border-radius:32px;margin:calc(-1 * clamp(24px,4vw,48px)) calc(-1 * clamp(24px,4vw,48px)) 0;min-height:clamp(430px,40vw,540px);display:flex;align-items:center;background:#e6e7ec">
   <div style="position:relative;width:100%;padding:clamp(24px,4vw,48px);container-type:inline-size">
    <h1 style="font-size:clamp(40px,4.6vw,72px);line-height:1.02;font-weight:500;letter-spacing:-0.035em;margin:0 0 30px;text-wrap:balance">Look up any drug's lawsuits, recalls and FDA record.</h1>
    <div id="heroSearch" style="display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid #fff;border-radius:22px;padding:10px 10px 10px 26px;cursor:text;box-shadow:0 28px 60px -24px rgba(59,99,184,.45),0 2px 6px rgba(17,17,20,.06)">
     <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b63b8" stroke-width="2.2" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
     <input readonly placeholder="Search by brand — e.g. Ozempic, Tylenol, Zantac" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:inherit;font-size:clamp(17px,1.6vw,20px);color:#111114;padding:14px 0;cursor:text">
     <span style="flex:none;display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:500;padding:16px 28px;border-radius:14px;background:#3b63b8;color:#fff">Search<kbd style="font-size:12px;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:0 6px;color:#fff">⌘K</kbd></span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:13.5px;color:#33353c">
     <span style="color:#6b6d75">Popular:</span>
     ${popular.map(p=>`<a href="#product-${p.s}" style="padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid rgba(17,17,20,.08);white-space:nowrap;color:inherit">${esc(p.br)}</a>`).join("")}
    </div>
    <p style="color:#6b6d75;font-size:14px;line-height:1.5;margin:22px 0 0;max-width:60ch">Search the brand your doctor wrote. See its maker, active ingredient, lawsuits and FDA notices — plus a transparent Litigation &amp; Regulatory Index. A public-records aggregator, not medical or legal advice.</p>
   </div>
  </div>
  <div style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:24px;font-size:12px;color:#6b6d75">
   ${legend.map(l=>`<span style="display:inline-flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${l[1]}"></span>${l[0]}</span>`).join("")}
  </div>
  <div style="margin-top:22px"><div style="font-size:13px;color:#8a8a93;margin-bottom:8px">Highest signal</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px">${top.map(prodCard).join("")}</div></div>
  <div style="margin-top:20px"><div style="font-size:13px;color:#8a8a93;margin-bottom:8px">Browse by class</div>
   <div style="display:flex;gap:7px;flex-wrap:wrap">${classes.map(c=>`<a href="#class-${c.slug}" style="${CHIP}">${esc(c.name)} <span style="color:#8a8a93">${c.prods.length}</span></a>`).join("")}</div></div>
  <div style="margin-top:20px">${noteCard('Note','The index reflects legal and reporting activity, not proven clinical danger. It is calculated per active ingredient, so brands of the same drug share a score. High means “worth attention,” not “unsafe.”','note')}</div>
 </div>`;
}

let FILTERS={cls:[],mf:[],bd:[]};
function pBrowse(){
 const classes=[...new Set(PRODUCTS.map(p=>p.cls?p.cls.name:'—'))];
 const mfs=[...new Set(PRODUCTS.map(p=>p.mf).filter(Boolean))];
 const cnt=(k,val)=>PRODUCTS.filter(p=>keyOf(p,k)===val).length;
 const keyOf=(p,k)=>k==='cls'?(p.cls?p.cls.name:'—'):k==='mf'?p.mf:p.bd;
 const grp=(title,k,vals)=>`<div><div style="font-size:13px;color:#8a8a93;margin-bottom:8px">${title}</div>${vals.map(val=>{const on=FILTERS[k].includes(val);return `<div data-act="facet:${k}:${esc(val)}" style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:${on?'#111114':'#6b6d75'};padding:3px 0;cursor:pointer;user-select:none"><span style="width:13px;height:13px;border:1px solid ${on?'#3b63b8':'rgba(17,17,20,.12)'};background:${on?'#3b63b8':'#fff'};border-radius:3px;flex:none"></span>${esc(val)}<span style="margin-left:auto;font-size:11px;color:#8a8a93;font-family:ui-monospace,monospace">${cnt(k,val)}</span></div>`;}).join("")}</div>`;
 const side=`<div style="flex:0 0 220px;max-width:100%;display:flex;flex-direction:column;gap:15px">${grp('Drug class','cls',classes)}${grp('Manufacturer','mf',mfs)}${grp('Band','bd',['Low','Moderate','Elevated','High'])}</div>`;
 const has=Object.values(FILTERS).some(a=>a.length);
 const list=PRODUCTS.filter(p=>(!FILTERS.cls.length||FILTERS.cls.includes(p.cls?p.cls.name:'—'))&&(!FILTERS.mf.length||FILTERS.mf.includes(p.mf))&&(!FILTERS.bd.length||FILTERS.bd.includes(p.bd)));
 const main=`<div style="flex:1 1 420px;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;min-height:28px"><div style="font-size:13px;color:#8a8a93">${list.length} products${has?' · filtered':''}</div>${has?'<span data-act="clearf" style="'+CHIP+'">Clear filters</span>':''}</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px">${list.map(prodCard).join("")}</div>${list.length?'':'<div style="color:#6b6d75;font-size:13px">Nothing matches the filter.</div>'}</div>`;
 return `<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">${side}${main}</div>`;
}

let SORT={k:'ix',d:-1};
function pExplore(){
 const val=(p,k)=>k==='br'?p.br:k==='ing'?p.ing.inn:k==='cls'?(p.cls?p.cls.name:''):k==='mf'?(p.mf||''):k==='bd'?p.bd:(p.ix==null?-1:p.ix);
 const heads=[['br','Brand'],['ing','Ingredient'],['cls','Class'],['mf','Manufacturer'],['ix','Index'],['bd','Band']];

 return `<div style="font-size:13px;color:#8a8a93;margin-bottom:8px">Explorer</div><h1 style="font-size:clamp(30px,3.6vw,44px);line-height:1.05;font-weight:500;margin:0 0 28px;letter-spacing:-0.03em">Every product — sort and slice</h1>

    <div style="color:#33353c;font-size:clamp(17px,2vw,22px);line-height:1.3;letter-spacing:-0.01em;margin-top:14px"><a href="#ingredient-${g.slug}" style="color:#3b63b8">${esc(g.inn)}</a>${cl?' · '+esc(cl.name):''}</div>

     ${p.ind?`<span style="${CHIP};cursor:default">${esc(p.ind)}</span>`:''}

   <p style="margin:0 0 ${linkMembers.length>1?'10px':'0'};font-size:13px;color:#33353c">Safety signals (FDA action, FAERS adverse events) are measured per active ingredient, so every medicine containing ${esc(g.inn)} carries the same index. These products differ in their <b>indication, form and dose</b>, not in this score.</p>

 const EB="font-size:13px;color:#8a8a93;margin-bottom:8px";
 const BOX="background:#fafafb;border:1px solid rgba(17,17,20,.08);border-radius:12px;padding:16px 18px";

 const arr='<div style="display:flex;align-items:center;color:#b9b8c4;font-size:20px">→</div>';
 return `<div style="${EB}">Methodology</div><h1 style="font-size:clamp(30px,3.6vw,44px);line-height:1.05;font-weight:500;margin:0 0 20px;letter-spacing:-0.03em">How the Litigation Signal Index is computed</h1>
  <p style="font-size:clamp(18px,2vw,22px);line-height:1.4;letter-spacing:-0.015em;color:#33353c;margin:0 0 18px;max-width:62ch;text-wrap:pretty">A transparent, weighted score to navigate a drug's public litigation and regulatory record. It is <b>not</b> a validated measure of clinical risk and not an FDA or WHO rating — it is an editorial composite we build from public data. It is calculated per <b>active ingredient</b>, so brands of the same drug share a score.</p>
  <div style="margin-bottom:18px">${noteCard("What it is — and isn't",'A navigation aid over public records. High means “a lot of legal and regulatory activity worth reading,” not “dangerous”; low is not a safety guarantee. A lawsuit is an allegation, not proof of harm. Not medical or legal advice.','note')}</div>
  <div style="${PANEL};margin-bottom:12px"><div style="${EB}">The pipeline at a glance</div><h3 style="${H3}">From public records to one number</h3>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 6px">${node('Public records','FDA notices · MDL/court dockets · FAERS · SEC')}${arr}${node('4 component scores','each mapped to 0–100')}${arr}${node('× weight','30 / 25 / 25 / 20')}${arr}${node('Σ = Index','0–100')}${arr}${node('Band','Low · Moderate · Elevated · High')}</div>
   <p style="color:#6b6d75;font-size:12.5px;margin:12px 0 0">Components are measured at the level they belong to — <b>molecule</b> (FDA action, FAERS), <b>class</b> (class-wide MDLs) or <b>brand</b> — and inherited by the product, which is why a card labels each input's scope. If a component has no data (e.g. outcomes pending), its weight is removed and the rest rescaled, and confidence is lowered.</p></div>
  <div style="${PANEL};margin-bottom:12px"><div style="${EB}">How a medicine is listed</div><h3 style="${H3}">Class › ingredient › brand</h3>
   <p style="font-size:14px;color:#33353c;margin:0 0 10px">You search the <b>brand</b> your doctor wrote (Ozempic). Each brand links to its <b>active ingredient</b> (semaglutide) and its <b>drug class</b> (GLP-1 receptor agonists). The index is computed on the ingredient, so every brand of the same ingredient shares it — they differ in indication, form and maker, not in the score. Litigation attaches at the level it belongs to: a class-wide MDL to the class, a molecule-level warning to the ingredient, a brand-specific suit to the brand.</p>
   <p style="font-size:12.5px;color:#8a8a93;margin:0">Entries are added evidence-first: every figure is verified against the public record before it is published, and adverse-event numbers come from openFDA FAERS.</p></div>
  <div style="${PANEL};margin-bottom:12px"><div style="${EB}">The formula</div><div style="${BOX};font-family:ui-monospace,monospace;font-size:13px;line-height:1.8">Index = Σ ( component_score × weight ) ÷ Σ ( weight of components with data )<br>bands:  Low 0–24 ·  Moderate 25–49 ·  Elevated 50–74 ·  High 75–100</div></div>
  <div style="${PANEL};margin-bottom:12px"><div style="${EB}">The four factors</div><h3 style="${H3}">What each measures, where it comes from, and why its weight</h3>
   <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px">
    <thead><tr><th style="${TH};width:132px">Factor</th><th style="${TH}">Measures</th><th style="${TH}">Source</th><th style="${TH};width:58px">Weight</th><th style="${TH};width:32%">Why this weight</th></tr></thead>
    <tbody>
     <tr><td style="${TD}"><b>Regulatory action</b></td><td style="${TD}">Boxed warnings, safety communications, label changes, recalls, withdrawals</td><td style="${TD}">FDA/openFDA, Federal Register, MHRA, EMA</td><td style="${TD};color:#3b63b8;font-weight:500">30%</td><td style="${TD}">A regulator acting is the strongest external, adjudicated signal — the closest thing to an authority's verdict.</td></tr>
     <tr><td style="${TD}"><b>Litigation volume</b></td><td style="${TD}">Number/size of filings and MDLs, normalized by exposure</td><td style="${TD}">CourtListener/RECAP, JPML, PACER</td><td style="${TD};color:#3b63b8;font-weight:500">25%</td><td style="${TD}">Breadth of claims — but raw counts track sales and solicitation, so it is exposure-normalized and capped.</td></tr>
     <tr><td style="${TD}"><b>AE severity</b></td><td style="${TD}">How serious reported adverse events are (ROR)</td><td style="${TD}">openFDA FAERS</td><td style="${TD};color:#3b63b8;font-weight:500">25%</td><td style="${TD}">Real-world seriousness — but spontaneous reporting is biased, so it cannot dominate.</td></tr>
     <tr><td style="${TD}"><b>Court outcomes</b></td><td style="${TD}">Verdicts, dismissals, settlements once resolved</td><td style="${TD}">Court dockets, SEC filings</td><td style="${TD};color:#3b63b8;font-weight:500">20%</td><td style="${TD}">Most meaningful when resolved — but &gt;95% settle with no admission and many stay pending, so lowest and dropped while pending.</td></tr>
    </tbody></table></div>
   <p style="color:#6b6d75;font-size:12.5px;margin:12px 0 0"><b>On the weights:</b> 30/25/25/20 is our editorial judgement (v1), not a figure from a study. We publish and version it — this is the part that is a choice, not a standard.</p></div>
  <div style="${PANEL};margin-bottom:12px"><div style="${EB}">Inside the AE-severity factor</div><h3 style="${H3}">A standard signal metric — not our own weighting</h3>
   <p style="font-size:14px;color:#33353c;margin:0 0 10px">This factor is the <b>Reporting Odds Ratio (ROR)</b> for serious outcomes — the signal-detection metric used by the EMA and MHRA — built from openFDA FAERS as the drug versus every other drug, serious vs non-serious reports:</p>
   <div style="${BOX};font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.8;margin-bottom:12px">ROR = (a·d) / (b·c)   —  a,b = the drug's serious / non-serious reports;  c,d = all other drugs'<br>95% CI = exp( ln ROR ± 1.96·√(1/a+1/b+1/c+1/d) )<br>AE_score = 100 × ( 1 − 1 / ROR_lower95 ),  capped 0–100</div>
   <p style="font-size:13px;color:#6b6d75;margin:0 0 12px">ROR &gt; 1 means the drug skews more serious than the average FAERS drug. We score off the conservative lower 95% bound; drugs with fewer than 50 reports stay marked EST.</p>
   ${noteCard('Why ROR','FDA, WHO and EMA publish no single “danger score” per drug — they use disproportionality metrics one drug–event pair at a time: PRR, ROR, IC/BCPNN (WHO Uppsala), EBGM/MGPS (FDA). We use ROR (exact from public counts, with a CI). EBGM — the Bayesian-shrinkage method used by the FDA — is a planned refinement.','note')}</div>
  <div style="${PANEL};margin-bottom:12px;border-color:#cfd5f6"><div style="${EB};color:#2f3fbf">Worked example · fictional</div><h3 style="${H3}">Veltraxa (velcarbide) — Caldwell Therapeutics</h3>
   <p style="font-size:13px;color:#6b6d75;margin:0 0 14px">A made-up drug and company, only to show the arithmetic.</p>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-bottom:14px">
    <div style="${BOX}"><div style="${EB}">① Regulatory</div><div style="font-size:13px">1 FDA safety comm. (2025) + label warning; no boxed warning. <b>→ 60</b></div></div>
    <div style="${BOX}"><div style="${EB}">② Litigation volume</div><div style="font-size:13px">MDL, ~1,200 cases; normalized to ≈2M patient-years. <b>→ 55</b></div></div>
    <div style="${BOX}"><div style="${EB}">③ AE severity (FAERS ROR)</div><div style="font-size:13px">ROR 2.0 (95% CI 2.0–2.1). <span style="font-family:ui-monospace,monospace;font-size:12px">100×(1−1/2.0)</span> <b>→ 50</b></div></div>
    <div style="${BOX}"><div style="${EB}">④ Court outcomes</div><div style="font-size:13px">2 bellwethers (1 plaintiff, 1 defense); no global settlement. <b>→ 50</b></div></div>
   </div>
   <div style="${BOX};font-size:13px;font-family:ui-monospace,monospace;line-height:1.9">
    <div style="display:flex;justify-content:space-between;color:#6b6d75"><span>Regulatory 60 × 0.30</span><span>= 18.00</span></div>
    <div style="display:flex;justify-content:space-between;color:#6b6d75"><span>Litigation 55 × 0.25</span><span>= 13.75</span></div>
    <div style="display:flex;justify-content:space-between;color:#6b6d75"><span>AE severity 50 × 0.25</span><span>= 12.50</span></div>
    <div style="display:flex;justify-content:space-between;color:#6b6d75"><span>Outcomes 50 × 0.20</span><span>= 10.00</span></div>
    <div style="display:flex;justify-content:space-between;border-top:1px solid rgba(17,17,20,.15);margin-top:6px;padding-top:6px;font-weight:600"><span>Index = Σ</span><span>54.25</span></div></div>
   <div style="display:flex;align-items:center;gap:12px;margin-top:12px"><span style="font-size:32px;font-weight:500;letter-spacing:-0.03em;font-variant-numeric:tabular-nums">54</span><span style="font-size:13.5px;color:#d9a23c;border:1px solid #efd59c;background:#faf1de;border-radius:999px;padding:4px 12px">Elevated (50–74)</span></div></div>
  <div style="${PANEL};margin-bottom:12px"><div style="${EB}">Provenance — what is standard, what is ours</div>
   <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px">
    <thead><tr><th style="${TH}">Element</th><th style="${TH};width:140px">Status</th><th style="${TH}">Basis</th></tr></thead>
    <tbody>
     <tr><td style="${TD}">Public records (FDA notices, dockets, SEC)</td><td style="${TD}">${tagObj}</td><td style="${TD}">Primary sources, cited per drug</td></tr>
     <tr><td style="${TD}">FAERS “serious” categories</td><td style="${TD}">${tagStd}</td><td style="${TD}">FDA / ICH definitions</td></tr>
     <tr><td style="${TD}">AE axis = ROR of serious outcomes</td><td style="${TD}">${tagStd}</td><td style="${TD}">EMA / MHRA signal metric, 95% CI</td></tr>
     <tr><td style="${TD}">Four-factor composite + weights (30/25/25/20)</td><td style="${TD}">${tagOurs}</td><td style="${TD}">Editorial design, versioned</td></tr>
     <tr><td style="${TD}">ROR→0–100 mapping &amp; band cut-offs</td><td style="${TD}">${tagOurs}</td><td style="${TD}">Editorial judgement, versioned</td></tr>
    </tbody></table></div></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px">
   <div style="${PANEL}"><h3 style="${H3}">Sources — legal</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${m('legal')}</div></div>
   <div style="${PANEL}"><h3 style="${H3}">Sources — medical</h3><div style="display:flex;flex-wrap:wrap;gap:7px">${m('medical')}</div></div></div>
  <div style="margin-top:16px">${noteCard('Not medical or legal advice','A public-records aggregator and navigation aid; a lawsuit is an allegation, not proof of harm. AE severity comes from openFDA FAERS (withdrawn drugs with sparse reports stay EST). Do not start, stop or change any medication based on this page — talk to your prescriber.','warn')}</div>`;
}

/* ============ palette ============ */
let palOpen=false, palQ="", palSel=0, palFlat=[];
function omniMatch(q){const t=q.trim().toLowerCase(),has=s=>!t||String(s).toLowerCase().includes(t);
 return {pr:PRODUCTS.filter(p=>has(p.br+' '+p.ing.inn+' '+(p.mf||'')+' '+(p.cls?p.cls.name:''))),
  ig:Object.values(ING).filter(g=>has(g.inn)),
  cl:Object.values(CLS).filter(c=>has(c.name)),
  mf:Object.values(MAN).filter(m=>has(m.name)&&PRODUCTS.some(p=>p.mfs===m.slug))};}
function renderPalette(){
 const wrap=document.getElementById('palwrap');
 if(!palOpen){wrap.innerHTML='';return;}
 const M=omniMatch(palQ);
 palFlat=[...M.pr.map(p=>'product-'+p.s),...M.ig.map(g=>'ingredient-'+g.slug),...M.cl.map(c=>'class-'+c.slug),...M.mf.map(m=>'mfr-'+m.slug)];
 if(palSel>=palFlat.length)palSel=0;
 let i=-1;const row=(route,ic,main,sub)=>{i++;const idx=i;return `<div data-nav="${route}" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;background:${idx===palSel?'#fafafb':'transparent'}"><span style="width:22px;height:22px;border-radius:6px;background:#fafafb;border:1px solid rgba(17,17,20,.08);display:grid;place-items:center;font-size:10px;color:#6b6d75;flex:none">${ic}</span><span style="flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(main)} <span style="color:#8a8a93;font-size:11.5px">· ${esc(sub)}</span></span></div>`;};
 const grp=(title,arr,fn)=>arr.length?`<div style="margin-bottom:12px"><div style="font-size:12.5px;color:#8a8a93;padding:0 6px 5px">${title} ${arr.length}</div>${arr.slice(0,6).map(fn).join("")}</div>`:'';
 const body=grp('Brands',M.pr,p=>row('product-'+p.s,'Rx',p.br,p.ing.inn+' · '+(p.mf||'')+' · '+(p.ix==null?'—':p.ix)))
  +grp('Ingredients',M.ig,g=>row('ingredient-'+g.slug,'∿',g.inn,(prodByIng[g.id]||[]).length+' brands'))
  +grp('Classes',M.cl,c=>row('class-'+c.slug,'◇',c.name,c.prods.length+' brands'))
  +grp('Manufacturers',M.mf,m=>row('mfr-'+m.slug,'Co',m.name,PRODUCTS.filter(p=>p.mfs===m.slug).length+' products'))
  +(palFlat.length?'':'<div style="padding:18px 12px;color:#6b6d75;font-size:13px">Not in the database yet.</div>');
 wrap.innerHTML=`<div id="palov" style="position:fixed;inset:0;z-index:50;background:rgba(236,236,240,.8);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:clamp(12px,8vh,90px) 14px">
  <div style="width:100%;max-width:720px;max-height:80vh;background:#fff;border:1px solid rgba(17,17,20,.12);border-radius:20px;box-shadow:0 24px 60px -28px rgba(17,17,20,.3);overflow:hidden;display:flex;flex-direction:column">
   <div style="display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid rgba(17,17,20,.08)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a8a93" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input id="palInput" value="${esc(palQ)}" placeholder="brand, ingredient, class, manufacturer…" style="flex:1;min-width:0;border:none;background:transparent;font:inherit;font-size:16px;color:#111114;outline:none"><span id="palClose" style="color:#8a8a93;cursor:pointer;font-size:12px">esc</span></div>
   <div style="display:flex;gap:15px;padding:9px 15px;border-bottom:1px solid rgba(17,17,20,.08);font-size:12.5px;color:#6b6d75;flex-wrap:wrap"><span>Brands <b style="color:#111114">${M.pr.length}</b></span><span>Ingredients <b style="color:#111114">${M.ig.length}</b></span><span>Classes <b style="color:#111114">${M.cl.length}</b></span><span>Makers <b style="color:#111114">${M.mf.length}</b></span></div>
   <div style="overflow:auto;padding:10px 10px 6px">${body}</div>
   <div style="display:flex;gap:15px;padding:9px 15px;border-top:1px solid rgba(17,17,20,.08);font-size:11px;color:#8a8a93"><span><span style="border:1px solid rgba(17,17,20,.12);border-radius:4px;padding:1px 5px">↑↓</span> Navigate</span><span><span style="border:1px solid rgba(17,17,20,.12);border-radius:4px;padding:1px 5px">↵</span> Open</span><span><span style="border:1px solid rgba(17,17,20,.12);border-radius:4px;padding:1px 5px">esc</span> Close</span></div>
  </div></div>`;
 const inp=document.getElementById('palInput'); if(inp){inp.focus();try{inp.setSelectionRange(inp.value.length,inp.value.length);}catch(e){} inp.addEventListener('input',e=>{palQ=e.target.value;palSel=0;renderPalette();});}
 document.getElementById('palClose').addEventListener('click',closePal);
 document.getElementById('palov').addEventListener('click',e=>{if(e.target.id==='palov')closePal();});
}
function openPal(q){palOpen=true;palQ=q||'';palSel=0;renderPalette();}
function closePal(){palOpen=false;renderPalette();}

/* ============ router ============ */
function route(){
 const h=(location.hash||'#home').replace(/^#/,'')||'home';
 let html;
 if(h.startsWith('product-'))html=pProduct(h.slice(8));
 else if(h.startsWith('ingredient-'))html=pIngredient(h.slice(11));
 else if(h.startsWith('class-'))html=pClass(h.slice(6));
 else if(h.startsWith('mfr-'))html=pMfr(h.slice(4));
 else if(h.startsWith('source-'))html=pSource(h.slice(7));
 else if(h==='browse')html=pBrowse();
 else if(h==='explore')html=pExplore();
 else if(h==='methodology')html=pMethod();
 else html=pHome();
 document.getElementById('stage').innerHTML=html;
 const page=h.split('-')[0];
 const nav=[['Browse','browse'],['Explore','explore'],['Methodology','methodology']];
 document.getElementById('nav').innerHTML=nav.map(([l,r])=>`<a href="#${r}" style="font-size:15px;color:${h===r?'#3b63b8':'#111114'};background:${h===r?'#eef0fb':'transparent'};padding:8px 14px;border-radius:999px;white-space:nowrap">${l}</a>`).join("");
 const hs=document.getElementById('heroSearch'); if(hs)hs.addEventListener('click',()=>openPal());
 hydrateImages();
 window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
 const navEl=e.target.closest('[data-nav]'); if(navEl){closePal();location.hash='#'+navEl.getAttribute('data-nav');return;}
 const a=e.target.closest('[data-act]'); if(!a)return;
 const act=a.getAttribute('data-act');
 if(act.startsWith('facet:')){const idx=act.indexOf(':');const rest=act.slice(idx+1);const k=rest.slice(0,rest.indexOf(':'));const v=rest.slice(rest.indexOf(':')+1);const arr=FILTERS[k];FILTERS[k]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];route();}
 else if(act==='clearf'){FILTERS={cls:[],mf:[],bd:[]};route();}
 else if(act.startsWith('sort:')){const k=act.slice(5);SORT.d=SORT.k===k?-SORT.d:-1;SORT.k=k;route();}
});
document.getElementById('openPal').addEventListener('click',()=>openPal());
window.addEventListener('hashchange',route);
window.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return;}
 if(!palOpen)return;
 if(e.key==='Escape')closePal();
 else if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palFlat.length-1);renderPalette();}
 else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);renderPalette();}
 else if(e.key==='Enter'&&palFlat[palSel]){closePal();location.hash='#'+palFlat[palSel];}
});

loadData().then(route).catch(err=>{
 document.getElementById('stage').innerHTML=`<div style="padding:60px 20px;text-align:center"><div style="font-size:18px;font-weight:500;margin-bottom:8px">Couldn't load live data</div><div style="color:#8a8a93;font-size:13px">${esc(err.message||err)}</div></div>`;
});
</script>
</body>
</html>
